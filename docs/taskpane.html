<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schreibe Zwei</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: "Segoe UI", sans-serif; margin: 16px; }
    h3 { margin-top: 0; }
    button {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #fff;
      background: #217346;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1a5c38; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 12px; font-size: 13px; min-height: 1.4em; }
  </style>
</head>
<body>
  <h3>Schreibe Zwei</h3>
  <p>Klicke in Excel eine Zelle an und dann auf den Button.</p>
  <button id="writeTwo" disabled>2 eintragen</button>
  <p id="status" role="status"></p>

  <script src="taskpane.js"></script>
</body>
</html>
