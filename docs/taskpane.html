<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schreibe Zwei</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: "Segoe UI", sans-serif; margin: 16px; }
    h3 { margin-top: 0; }
    button {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #fff;
      background: #217346;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    button.secondary { background: #5f6368; }
    button:hover { filter: brightness(0.92); }
    button:disabled { opacity: 0.5; cursor: default; }
    #user { font-size: 13px; margin: 0 0 12px; }
    #status { margin-top: 12px; font-size: 13px; min-height: 1.4em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h3>Schreibe Zwei</h3>

  <div id="loggedOut">
    <p>Bitte zuerst mit Google anmelden.</p>
    <button id="login" disabled>Mit Google anmelden</button>
  </div>

  <div id="loggedIn" hidden>
    <p id="user"></p>
    <button id="writeTwo">2 eintragen</button>
    <button id="logout" class="secondary">Abmelden</button>
  </div>

  <p id="status" role="status"></p>

  <script src="config.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
