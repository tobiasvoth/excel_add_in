<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Anmeldung</title>
  <script src="config.js"></script>
</head>
<body style="font-family: 'Segoe UI', sans-serif">
  <p>Weiterleitung zu Google …</p>
  <script>
    // Die Nonce kommt von der Seitenleiste und kommt im ID-Token zurück.
    const nonce = new URLSearchParams(location.search).get("nonce") || "";
    const params = new URLSearchParams({
      client_id: CONFIG.GOOGLE_CLIENT_ID,
      redirect_uri: new URL("auth-callback.html", location.href).href,
      response_type: "id_token",
      scope: "openid email profile",
      nonce: nonce,
      prompt: "select_account"
    });
    location.replace("https://accounts.google.com/o/oauth2/v2/auth?" + params.toString());
  </script>
</body>
</html>
