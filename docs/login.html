<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Anmeldung</title>
  <script src="config.js"></script>
</head>
<body style="font-family: 'Segoe UI', sans-serif">
  <p>Weiterleitung zu Google …</p>
  <script>
    // Der state kommt von der Seitenleiste und wird von Google unverändert zurückgegeben.
    const state = new URLSearchParams(location.search).get("state") || "";
    const params = new URLSearchParams({
      client_id: CONFIG.GOOGLE_CLIENT_ID,
      redirect_uri: new URL("auth-callback.html", location.href).href,
      response_type: "token",
      scope: CONFIG.SCOPE,
      state: state,
      prompt: "select_account"
    });
    location.replace("https://accounts.google.com/o/oauth2/v2/auth?" + params.toString());
  </script>
</body>
</html>
